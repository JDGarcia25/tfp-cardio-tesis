random_seed: 42

dataset_name: mitbih
dataset_path: BD2-20260218T192722Z-1-001/BD2

models:
  - kmeans
  - dbscan
  - hdbscan
  - autoencoder

# Representacion: "signal_pca" (Path A) o "manual_features" (Path B) con ventanas temporales
representation: manual_features

# Senal ECG
sampling_rate: 360
before_r_samples: 90
after_r_samples: 110
filter_lowcut: 0.5
filter_highcut: 40.0
filter_order: 4

# PCA (Path A)
pca_variance_threshold: 0.95

# Registros excluidos (ritmos de marcapasos - recomendacion AAMI)
excluded_records:
  - "102"
  - "104"
  - "107"
  - "217"

# ============================================================
# Hiperparametros de modelos
# ============================================================

# K-Means: k=3 clusters, seleccionado por mejor F1 sobre eval_idx en un
# barrido de k = 2,3,4,5,6,8,10 bajo el protocolo real de produccion
# (ajuste solo con fit_idx, prediccion inductiva sobre el resto, metricas
# sobre eval_idx -- ver notebook 04, Seccion 3). k=3 da F1=0,5782 y
# recall=0,6664, ambos maximos del barrido; k=2 maximiza el silhouette
# (0,3370) pero el silhouette mide separacion geometrica, no capacidad de
# deteccion. k=5 tenia mejor precision (0,5352 vs 0,5106) pero peor
# recall -- se prioriza recall porque un falso negativo (arritmia no
# detectada) tiene mayor costo clinico que un falso positivo.
# Distance-scoring normalizado por dispersion de cluster.
# threshold_method="iqr": el umbral se deriva de la valla de Tukey
# (Q3 + 1.5*IQR) sobre la distribucion de scores, SIN consultar las
# etiquetas AAMI. Esto preserva el caracter no supervisado del metodo.
# Se prefirio sobre el metodo del codo (Satopaa et al. 2011) porque ese
# metodo colapsa con la cola extrema de scores que produce la correccion
# de la paradoja del singleton (ver kmeans.py); la valla de Tukey, basada
# en cuartiles, es robusta a esa cola.
# distance_percentile y min_cluster_size quedan como parametros del modo
# alternativo de umbral (percentil sobre los scores, en vez de la valla
# de Tukey). Ese modo no se ejercita en el pipeline principal mientras
# threshold_method=iqr; se conserva documentado por si se quiere repetir
# el analisis de sensibilidad, no porque el pipeline lo use.
kmeans_params:
  n_clusters: 3
  random_state: 42
  n_init: 20
  threshold_method: iqr
  distance_percentile: 89.5   # no usado con threshold_method=iqr
  min_cluster_size: 10        # clusters con menos miembros se consideran degenerados

# DBSCAN: eps auto-calibrado por k-distancias.
# eps_percentile subido de 75 -> 90 para acercarse al "codo" de la
# curva de k-distancias (metodo canonico de Ester et al. 1996).
# min_samples subido de 5 -> 10 por la dimensionalidad (~17 features).
dbscan_params:
  eps: auto
  min_samples: 10
  eps_percentile: 90

# HDBSCAN: se probo un barrido de 45 combinaciones (min_cluster_size
# 50-2000, min_samples 5-25, cluster_selection_epsilon 0.0-0.5) sobre una
# submuestra ESTRATIFICADA de 20.000 latidos, y min_cluster_size=200 /
# min_samples=25 dio el mejor F1 ahi (0,4005; 3 clusters, 36,04% de
# ruido). Ese resultado NO transfiere al dataset completo: los umbrales
# de densidad de HDBSCAN dependen del tamano del conjunto, y sobre los
# 100.705 latidos reales esa configuracion dio 65 clusters y 54,5% de
# ruido -- peor que el 44,9% de esta configuracion original. Se
# conservan min_cluster_size=50 / min_samples=10.
# cluster_selection_epsilon se deja en 0.0: no tuvo efecto medible en
# ninguna de las 45 combinaciones probadas (mismo resultado para 0.0,
# 0.1 y 0.5 con mcs/min_samples fijos).
hdbscan_params:
  min_cluster_size: 50
  min_samples: 10
  cluster_selection_epsilon: 0.0

# Autoencoder: capacidad aumentada para poder reconstruir la clase
# normal (condicion necesaria para que el error discrimine anomalias).
# Compresion 200 -> 16 (~12x).
# epochs=100 con EarlyStopping (patience=5) que corta al converger.
#
# normal_fpr (antes "anomaly_rate"): presupuesto de FALSAS ALARMAS
# sobre la clase normal, NO la prevalencia del dataset. El nombre
# anterior era enganoso: el umbral se calcula sobre el fit set, que
# es 100% normal, de modo que "tasa de anomalia" no aplicaba.
autoencoder_params:
  encoding_dim: 16
  hidden_layers: [64, 32]
  epochs: 100
  batch_size: 256
  normal_fpr: 0.105
  learning_rate: 0.001
  random_state: 42

# Salida
output_dir: ./results
generate_plots: true
logging_level: INFO